name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
        drizzle: ['0.40.1', '0.44.7', '0.45.4', '1.0.0-rc.6']
    name: node ${{ matrix.node }}, drizzle-orm ${{ matrix.drizzle }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm add -D drizzle-orm@${{ matrix.drizzle }}
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
